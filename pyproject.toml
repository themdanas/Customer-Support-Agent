[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent"
version = "0.1.0"
description = "Stateful, observable AI customer support agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "psycopg-pool>=3.2.0",
    "scikit-learn>=1.3.0",
    "pytest>=8.0.0",
    "faker>=24.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "eval*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
